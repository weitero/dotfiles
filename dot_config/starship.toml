# tombi: format.rules.table-keys-order = "version-sort"

"$schema" = "https://starship.rs/config-schema.json"
add_newline = false
continuation_prompt = "quote> "
format = "$all$jobs$status$character"

[aws]
expiration_symbol = ""
symbol = "󰸏 "

[azure]
disabled = false
symbol = "󰠅 "

[battery]
charging_symbol = "󰂄"
discharging_symbol = "󰂂"
empty_symbol = "󰂎"
full_symbol = "󰁹"
unknown_symbol = "󰂑"

[[battery.display]]
threshold = 20

[buf]
disabled = true

[bun]
symbol = " "

[c]
symbol = "󰙱 "

[character]
error_symbol = "[%](bold red)"
